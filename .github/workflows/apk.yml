name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build APK via Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          yes | bubblewrap init --manifest=https://taha-mht.github.io/TAALIM_IA/manifest.json
          yes | bubblewrap build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAALIM_IA_Android_APK
          path: |
            *.apk
            **/*.apk


