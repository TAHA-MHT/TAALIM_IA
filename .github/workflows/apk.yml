name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap & Build APK
        run: |
          npm install -g @bubblewrap/cli
          yes | bubblewrap init --manifest=https://taha-mht.github.io/TAALIM_IA/manifest.json || true
          bubblewrap build --manifest=https://taha-mht.github.io/TAALIM_IA/manifest.json || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAALIM_IA_Android_APK
          path: |
            *.apk
            **/*.apk
