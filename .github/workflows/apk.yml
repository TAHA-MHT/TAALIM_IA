name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Accept Android SDK Licenses & Build APK
        run: |
          # 1. Acceptation automatique de toutes les licences du SDK préinstallé sur le runner
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # 2. Installation de Bubblewrap et génération automatique
          npm install -g @bubblewrap/cli
          
          # Génération du projet Android en répondant automatiquement "oui" aux invites
          yes | bubblewrap init --manifest=https://taha-mht.github.io/TAALIM_IA/manifest.json --directory=android-app
          
          cd android-app
          yes | bubblewrap build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAALIM_IA_Android_APK
          path: |
            android-app/*.apk
            *.apk
            **/*.apk
