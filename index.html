<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAALIM_IA / Kalam — CP1 & CP2 Bilingue</title>
  <style>
    :root {
      --primary: #2B6CB0;
      --secondary: #319795;
      --accent: #DD6B20;
      --bg: #F7FAFC;
      --card-bg: #FFFFFF;
      --text: #1A202C;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    /* Header */
    .app-header { text-align: center; margin-bottom: 15px; width: 100%; max-width: 500px; }
    .slogan { font-size: 14px; font-weight: bold; color: #2B6CB0; margin-bottom: 5px; }
    .app-title { font-size: 24px; font-weight: bold; color: var(--primary); margin: 0; }
    
    /* Controls Bar */
    .controls { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 500px; margin-bottom: 20px; gap: 10px; }
    .nav-btn { padding: 8px 14px; border: 2px solid var(--primary); background: white; color: var(--primary); font-weight: bold; border-radius: 20px; cursor: pointer; transition: 0.2s; }
    .nav-btn.active { background: var(--primary); color: white; }
    .lang-btn { background: #E2E8F0; border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    /* Container Card */
    .card { background: var(--card-bg); border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 500px; text-align: center; }

    /* Module Selector Grid */
    .modules-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .btn-module { background: #EDF2F7; border: 2px solid #CBD5E0; border-radius: 15px; padding: 15px 10px; font-size: 15px; font-weight: bold; color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: 0.2s; }
    .btn-module.active { background: #EBF8FF; border-color: var(--primary); color: var(--primary); }
    .btn-module span.icon { font-size: 28px; }

    /* Interactive Area */
    .activity-box { background: #F8FAFC; border-radius: 15px; padding: 15px; border: 1px dashed #CBD5E0; min-height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 15px; position: relative; }
    .question-text { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #2D3748; }

    /* Graphics & Display Elements */
    .objects-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 15px; }
    .item-icon { font-size: 32px; animation: pop 0.3s ease-out; }
    .math-expr { font-size: 36px; font-weight: bold; color: var(--primary); }
    .text-display { font-size: 32px; font-weight: bold; color: var(--primary); letter-spacing: 2px; }

    /* Canvas pour l'écriture */
    canvas { background: white; border: 2px solid #CBD5E0; border-radius: 10px; touch-action: none; cursor: crosshair; }

    /* Response Options */
    .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
    .btn-opt { background: white; border: 2px solid #CBD5E0; border-radius: 12px; padding: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.1s; }
    .btn-opt:active { transform: scale(0.96); }
    .btn-opt.correct { background: #C6F6D5; border-color: #38A169; color: #22543D; }
    .btn-opt.wrong { background: #FED7D7; border-color: #E53E3E; color: #742A2A; }

    /* Action & Feedback */
    .feedback { font-size: 16px; font-weight: bold; height: 26px; margin: 10px 0; }
    .btn-action { background: var(--secondary); color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; display: none; margin: 0 auto; }

    /* RTL specific */
    [dir="rtl"] .controls { flex-direction: row-reverse; }

    @keyframes pop {
      0% { transform: scale(0); }
      80% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="slogan">« وَٱعْتَصِمُوا۟ بِحَبْلِ ٱللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا۟ »</div>
    <div class="app-title" id="appTitle">TAALIM_IA — تعليم</div>
  </div>

  <!-- Barre de contrôle : Niveau et Langue -->
  <div class="controls">
    <div>
      <button class="nav-btn active" id="btnCP1" onclick="setLevel('cp1')">CP1 / الأول</button>
      <button class="nav-btn" id="btnCP2" onclick="setLevel('cp2')">CP2 / الثاني</button>
    </div>
    <button class="lang-btn" id="btnLang" onclick="toggleLanguage()">🇸🇳 / 🇸🇦 AR</button>
  </div>

  <div class="card">
    <!-- Sélection du Module -->
    <div class="modules-grid">
      <button class="btn-module active" id="modMath" onclick="setModule('math')">
        <span class="icon">📐</span>
        <span class="label">Maths / حساب</span>
      </button>
      <button class="btn-module" id="modRead" onclick="setModule('read')">
        <span class="icon">📖</span>
        <span class="label">Lecture / قراءة</span>
      </button>
      <button class="btn-module" id="modWrite" onclick="setModule('write')">
        <span class="icon">✏️</span>
        <span class="label">Écriture / كتابة</span>
      </button>
      <button class="btn-module" id="modWorld" onclick="setModule('world')">
        <span class="icon">🌍</span>
        <span class="label">Éveil / إكتشاف</span>
      </button>
    </div>

    <!-- Zone d'exercice -->
    <div class="question-text" id="questionText">...</div>
    
    <div class="activity-box" id="activityBox">
      <!-- Zone dynamique injectée en JS -->
    </div>

    <div class="options-grid" id="optionsGrid"></div>

    <div class="feedback" id="feedback"></div>
    <button class="btn-action" id="btnNext" onclick="nextQuestion()">Suivant / التالي ➔</button>
  </div>

  <script>
    let currentLang = 'fr'; // 'fr' ou 'ar'
    let currentLevel = 'cp1'; // 'cp1' ou 'cp2'
    let currentModule = 'math'; // 'math', 'read', 'write', 'world'
    let correctAnswer = null;

    // Traductions de l'interface
    const uiText = {
      fr: {
        title: "TAALIM_IA — Kalam",
        next: "Question suivante ➔",
        clear: "Effacer",
        bravo: "🎉 Bravo ! Bonne réponse !",
        wrong: "❌ Essaye encore !",
        mathLabel: "Maths",
        readLabel: "Lecture",
        writeLabel: "Écriture",
        worldLabel: "Éveil",
        writeInst: "Trace avec ton doigt le modèle ci-dessus :"
      },
      ar: {
        title: "تعليم الذكاء الاصطناعي — القلم",
        next: "السؤال التالي ➔",
        clear: "مسح",
        bravo: "🎉 أحسنت! إجابة صحيحة!",
        wrong: "❌ حاول مرة أخرى!",
        mathLabel: "حساب",
        readLabel: "قراءة",
        writeLabel: "كتابة",
        worldLabel: "إكتشاف",
        writeInst: "ارسم بإصبعك الشبيه بالنموذج أعلاه:"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'fr' ? 'ar' : 'fr';
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('btnLang').textContent = currentLang === 'fr' ? '🇸🇳 / 🇸🇦 AR' : '🇸🇦 / 🇫🇷 FR';
      
      // Update UI labels
      document.getElementById('appTitle').textContent = uiText[currentLang].title;
      document.querySelector('#modMath .label').textContent = uiText[currentLang].mathLabel;
      document.querySelector('#modRead .label').textContent = uiText[currentLang].readLabel;
      document.querySelector('#modWrite .label').textContent = uiText[currentLang].writeLabel;
      document.querySelector('#modWorld .label').textContent = uiText[currentLang].worldLabel;

      loadExercise();
    }

    function setLevel(lvl) {
      currentLevel = lvl;
      document.getElementById('btnCP1').classList.toggle('active', lvl === 'cp1');
      document.getElementById('btnCP2').classList.toggle('active', lvl === 'cp2');
      loadExercise();
    }

    function setModule(mod) {
      currentModule = mod;
      ['modMath', 'modRead', 'modWrite', 'modWorld'].forEach(id => {
        document.getElementById(id).classList.remove('active');
      });
      document.getElementById('mod' + mod.charAt(0).toUpperCase() + mod.slice(1)).classList.add('active');
      loadExercise();
    }

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function loadExercise() {
      const qText = document.getElementById('questionText');
      const box = document.getElementById('activityBox');
      const opts = document.getElementById('optionsGrid');
      const feedback = document.getElementById('feedback');
      const btnNext = document.getElementById('btnNext');

      box.innerHTML = '';
      opts.innerHTML = '';
      feedback.textContent = '';
      btnNext.style.display = 'none';

      if (currentModule === 'math') {
        renderMath(qText, box, opts);
      } else if (currentModule === 'read') {
        renderRead(qText, box, opts);
      } else if (currentModule === 'write') {
        renderWrite(qText, box, opts);
      } else if (currentModule === 'world') {
        renderWorld(qText, box, opts);
      }
    }

    /* --- MODULE MATHEMATIQUES --- */
    function renderMath(qText, box, opts) {
      const icons = ['🍎', '⭐', '🎈', '🐱', '🚗', '🍓'];
      if (currentLevel === 'cp1') {
        qText.textContent = currentLang === 'fr' ? "Combien y a-t-il d'éléments ?" : "كم عدد العناصر؟";
        correctAnswer = getRandomInt(2, 8);
        const icon = icons[getRandomInt(0, icons.length - 1)];
        
        const grid = document.createElement('div');
        grid.className = 'objects-grid';
        for (let i = 0; i < correctAnswer; i++) {
          grid.innerHTML += `<span class="item-icon">${icon}</span>`;
        }
        box.appendChild(grid);
      } else {
        qText.textContent = currentLang === 'fr' ? "Calcule le résultat :" : "احسب النتيجة:";
        const isAdd = Math.random() > 0.5;
        const a = getRandomInt(3, 10);
        const b = getRandomInt(1, 10);
        if (isAdd) {
          correctAnswer = a + b;
          box.innerHTML = `<div class="math-expr">${a} + ${b} = ?</div>`;
        } else {
          correctAnswer = Math.max(a, b) - Math.min(a, b);
          box.innerHTML = `<div class="math-expr">${Math.max(a, b)} - ${Math.min(a, b)} = ?</div>`;
        }
      }
      generateNumericOptions(opts);
    }

    /* --- MODULE LECTURE / PHONIE --- */
    function renderRead(qText, box, opts) {
      if (currentLevel === 'cp1') {
        if (currentLang === 'fr') {
          qText.textContent = "Quelle voyelle entends-tu dans ce mot ?";
          const words = [
            { text: "CHAT 🐱", ans: "A" },
            { text: "LIT 🪑", ans: "I" },
            { text: "VELO 🚲", ans: "O" },
            { text: "BUS 🚌", ans: "U" }
          ];
          const item = words[getRandomInt(0, words.length - 1)];
          box.innerHTML = `<div class="text-display">${item.text}</div>`;
          correctAnswer = item.ans;
          renderChoices(opts, ['A', 'I', 'O', 'U']);
        } else {
          qText.textContent = "ما هو الحرف الأول في هذه الكلمة؟";
          const words = [
            { text: "أَسَدٌ 🦁", ans: "أ" },
            { text: "بَابٌ 🚪", ans: "ب" },
            { text: "تُفَّاحٌ 🍎", ans: "ت" },
            { text: "جَمَلٌ 🐪", ans: "ج" }
          ];
          const item = words[getRandomInt(0, words.length - 1)];
          box.innerHTML = `<div class="text-display">${item.text}</div>`;
          correctAnswer = item.ans;
          renderChoices(opts, ['أ', 'ب', 'ت', 'ج']);
        }
      } else { // CP2
        if (currentLang === 'fr') {
          qText.textContent = "Trouve la bonne syllabe pour compléter :";
          const items = [
            { text: "MA...ON 🏠", ans: "IS", choices: ["IS", "OU", "AN", "ON"] },
            { text: "MO...ON 🐑", ans: "UT", choices: ["UT", "IN", "OI", "CH"] }
          ];
          const item = items[getRandomInt(0, items.length - 1)];
          box.innerHTML = `<div class="text-display">${item.text}</div>`;
          correctAnswer = item.ans;
          renderChoices(opts, item.choices);
        } else {
          qText.textContent = "اختر الحركة المناسبة للكلمة:";
          const items = [
            { text: "شَـ...ـسٌ ☀️", ans: "مْ", choices: ["مْ", "مَ", "مُ", "مِ"] },
            { text: "قَـ...ـرٌ 🌙", ans: "مَ", choices: ["مَ", "مُ", "مِ", "مْ"] }
          ];
          const item = items[getRandomInt(0, items.length - 1)];
          box.innerHTML = `<div class="text-display">${item.text}</div>`;
          correctAnswer = item.ans;
          renderChoices(opts, item.choices);
        }
      }
    }

    /* --- MODULE ECRITURE / GRAPHISME --- */
    function renderWrite(qText, box, opts) {
      qText.textContent = uiText[currentLang].writeInst;
      const model = currentLevel === 'cp1' 
        ? (currentLang === 'fr' ? 'L' : 'ا') 
        : (currentLang === 'fr' ? 'MA' : 'بـ');

      box.innerHTML = `
        <div class="text-display" style="margin-bottom:10px;">${model}</div>
        <canvas id="paintCanvas" width="260" height="120"></canvas>
      `;

      initCanvas();

      opts.innerHTML = `
        <button class="btn-opt" style="grid-column: span 2;" onclick="clearCanvas()">${uiText[currentLang].clear}</button>
      `;
      document.getElementById('btnNext').style.display = 'block';
    }

    /* --- MODULE DECOUVERTE DU MONDE --- */
    function renderWorld(qText, box, opts) {
      if (currentLevel === 'cp1') {
        qText.textContent = currentLang === 'fr' ? "Quel organe sert à VOIR ?" : "أي عضو نستخدمه لِلرُّؤْيَةِ؟";
        box.innerHTML = `<div style="font-size:48px;">👀 👂 👃 ✋</div>`;
        correctAnswer = currentLang === 'fr' ? "Les yeux" : "العينين";
        renderChoices(opts, currentLang === 'fr' 
          ? ["Les yeux", "Les oreilles", "Le nez", "La main"]
          : ["العينين", "الأذنين", "الأنف", "اليد"]);
      } else {
        qText.textContent = currentLang === 'fr' ? "Cet animal est-il herbivore ou carnivore ?" : "هل هذا الحيوان عشبي أم ملحم؟";
        box.innerHTML = `<div class="text-display">🦁 (Lion / أسد)</div>`;
        correctAnswer = currentLang === 'fr' ? "Carnivore" : "ملحم";
        renderChoices(opts, currentLang === 'fr' 
          ? ["Carnivore", "Herbivore"]
          : ["ملحم", "عشبي"]);
      }
    }

    /* --- FONCTIONS AUXILIAIRES ET EVENEMENTS --- */
    function generateNumericOptions(optsContainer) {
      let choices = [correctAnswer];
      while (choices.length < 4) {
        let wrong = correctAnswer + getRandomInt(-3, 3);
        if (wrong >= 0 && !choices.includes(wrong)) choices.push(wrong);
      }
      choices.sort(() => Math.random() - 0.5);
      renderChoices(optsContainer, choices);
    }

    function renderChoices(container, choicesArray) {
      container.innerHTML = '';
      choicesArray.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.textContent = choice;
        btn.onclick = () => checkAnswer(btn, choice);
        container.appendChild(btn);
      });
    }

    function checkAnswer(selectedBtn, val) {
      const feedback = document.getElementById('feedback');
      const btnNext = document.getElementById('btnNext');
      const allBtns = document.querySelectorAll('.btn-opt');

      allBtns.forEach(b => b.disabled = true);

      if (val === correctAnswer) {
        selectedBtn.classList.add('correct');
        feedback.textContent = uiText[currentLang].bravo;
        feedback.style.color = "#38A169";
      } else {
        selectedBtn.classList.add('wrong');
        feedback.textContent = uiText[currentLang].wrong;
        feedback.style.color = "#E53E3E";
        allBtns.forEach(b => {
          if (b.textContent == correctAnswer) b.classList.add('correct');
        });
      }
      btnNext.style.display = 'block';
    }

    function nextQuestion() {
      loadExercise();
    }

    /* Canvas Drawing Helper */
    let isDrawing = false;
    let canvas, ctx;

    function initCanvas() {
      canvas = document.getElementById('paintCanvas');
      if (!canvas) return;
      ctx = canvas.getContext('2d');
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#2B6CB0';

      const startDraw = (e) => {
        isDrawing = true;
        ctx.beginPath();
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        ctx.moveTo(clientX - rect.left, clientY - rect.top);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        ctx.lineTo(clientX - rect.left, clientY - rect.top);
        ctx.stroke();
      };

      const stopDraw = () => { isDrawing = false; };

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDraw);
      canvas.addEventListener('touchstart', startDraw);
      canvas.addEventListener('touchmove', draw);
      canvas.addEventListener('touchend', stopDraw);
    }

    function clearCanvas() {
      if (ctx && canvas) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    // Premier chargement
    loadExercise();
  </script>
</body>
</html>
