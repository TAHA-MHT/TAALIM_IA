name: Bootstrap Flutter App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Create Flutter project in place
        run: |
          flutter create --platforms=android --org com.shadyatechnologie --project-name taalim_ia .

      - name: Commit and push generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap Flutter project structure for TAALIM_IA"
          git push
